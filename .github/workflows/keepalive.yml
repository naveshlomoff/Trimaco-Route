name: Supabase keep-alive

# Free Supabase projects are paused after about a week without database
# activity (a holiday week would do it). One tiny call a day keeps the
# database awake; if the project does get paused, this job fails and
# GitHub emails a failed-run notice.

on:
  schedule:
    - cron: "23 5 * * *" # every day at 05:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call public.ping()
        env:
          SUPABASE_URL: https://joomobxzhsvlfgcsckoj.supabase.co
          # the public key already shipped in the site's JavaScript (src/config.ts)
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_pj1V9M0vAY90BwUgJCjfkg_ng0RLPLT
        run: |
          code=$(curl -sS -m 30 --retry 3 --retry-all-errors --retry-delay 10 \
            -o body.txt -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/ping" || true)
          echo "HTTP ${code:-none}: $(cat body.txt 2>/dev/null)"
          [ "$code" = "200" ]
